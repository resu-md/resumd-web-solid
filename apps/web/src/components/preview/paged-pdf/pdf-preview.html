<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>Resume PDF preview</title>
        <style>
            :root {
                --preview-zoom-scale: 1;
            }

            body {
                margin: 0;
                padding: 0;
            }

            /* Hide the preview while it's rendering */
            .preview-hidden {
                position: absolute;
                top: 0;
                left: 0;
                visibility: hidden;
                transform: translateX(-10000px); /* move it out of view to avoid scrollbar flickering during render */
            }
            .preview-visible {
                position: relative;
                visibility: visible;
                transform: none;
                margin-left: auto;
                margin-right: auto;
            }

            /* PagedJS default styles */
            .pagedjs_pages {
                width: max-content;
                display: block;
                margin: 3.5rem 0 5px 0;
                transform: scale(var(--preview-zoom-scale, 1));
                transform-origin: top left;
            }
            .pagedjs_page {
                margin: 5px auto;
                background: white;
                box-shadow:
                    0px 0px 0px 1px rgba(0, 0, 0, 0.06),
                    0 0 20px -1px rgba(0, 0, 0, 0.08);
            }
        </style>

        <script src="{{PAGED_JS_URL}}"></script>

        <script>
            let currentRenderId = 0;
            let isRendering = false;
            let queuedRender = null;
            let lastInsertedStyles = [];
            let pendingZoomRaf = null;

            const parsePixels = (value) => {
                const parsed = Number.parseFloat(value);
                return Number.isFinite(parsed) ? parsed : 0;
            };

            const getCurrentZoomScale = () => {
                const raw = window.getComputedStyle(document.documentElement).getPropertyValue("--preview-zoom-scale");
                const parsed = Number.parseFloat(raw);
                return Number.isFinite(parsed) && parsed > 0 ? parsed : 1;
            };

            const clamp = (value, min, max) => Math.min(Math.max(value, min), max);

            const clampScrollPosition = (scrollRoot) => {
                const maxLeft = Math.max(0, scrollRoot.scrollWidth - window.innerWidth);
                const maxTop = Math.max(0, scrollRoot.scrollHeight - window.innerHeight);
                scrollRoot.scrollLeft = clamp(scrollRoot.scrollLeft, 0, maxLeft);
                scrollRoot.scrollTop = clamp(scrollRoot.scrollTop, 0, maxTop);
            };

            const syncContainerSize = (container, scale) => {
                const pages = container.querySelector(".pagedjs_pages");
                if (!pages) return;

                const pageStyles = window.getComputedStyle(pages);
                const marginTop = parsePixels(pageStyles.marginTop);
                const marginBottom = parsePixels(pageStyles.marginBottom);
                const baseWidth = pages.scrollWidth;
                const baseHeight = pages.scrollHeight;

                if (!baseWidth || !baseHeight) return;

                container.style.width = `${Math.ceil(baseWidth * scale)}px`;
                container.style.height = `${Math.ceil(baseHeight * scale + marginTop + marginBottom)}px`;
            };

            window.setPreviewZoom = (scale, anchorX, anchorY) => {
                const normalizedScale = Number.isFinite(scale) && scale > 0 ? scale : 1;
                const previousScale = getCurrentZoomScale();
                const targetAnchorX = Number.isFinite(anchorX) ? anchorX : window.innerWidth / 2;
                const targetAnchorY = Number.isFinite(anchorY) ? anchorY : window.innerHeight / 2;

                const visibleContainer = document.querySelector(".preview-visible");
                const pages = visibleContainer?.querySelector(".pagedjs_pages");
                const hasAnchoredPoint = pages instanceof HTMLElement && previousScale > 0;
                let pointX = 0;
                let pointY = 0;

                if (hasAnchoredPoint) {
                    const beforeRect = pages.getBoundingClientRect();
                    pointX = (targetAnchorX - beforeRect.left) / previousScale;
                    pointY = (targetAnchorY - beforeRect.top) / previousScale;
                }

                document.documentElement.style.setProperty("--preview-zoom-scale", `${normalizedScale}`);

                if (visibleContainer instanceof HTMLElement) {
                    syncContainerSize(visibleContainer, normalizedScale);
                }

                if (!hasAnchoredPoint) return;

                if (pendingZoomRaf !== null) {
                    cancelAnimationFrame(pendingZoomRaf);
                }

                pendingZoomRaf = requestAnimationFrame(() => {
                    pendingZoomRaf = null;

                    const afterRect = pages.getBoundingClientRect();
                    const moveX = afterRect.left + pointX * normalizedScale - targetAnchorX;
                    const moveY = afterRect.top + pointY * normalizedScale - targetAnchorY;

                    const scrollRoot = document.scrollingElement || document.documentElement;
                    if (!scrollRoot) return;

                    scrollRoot.scrollLeft += moveX;
                    scrollRoot.scrollTop += moveY;
                    clampScrollPosition(scrollRoot);
                });
            };

            // The main render function called from the parent
            window.renderPreview = async (html, css) => {
                // If we are already rendering, queue this request
                if (isRendering) {
                    queuedRender = { html, css };
                    return;
                }

                isRendering = true;
                const renderId = ++currentRenderId;

                // Ensure at least one page is rendered even if HTML is empty
                if (!html || !html.trim()) {
                    html = "&nbsp;";
                }

                try {
                    // 1. Prepare styles
                    // We pass the CSS as an "inline" stylesheet to PagedJS.
                    // This ensures PagedJS parses @page rules using its Polisher.
                    // We use a dummy URL or the current location as the key for the object format.
                    const cssContent = "@page { margin: 0.4in; }\n" + css + "\n@page { size: letter !important; }"; // TODO: Temp fix to jitter issue
                    const stylesheets = [{ [window.location.href]: cssContent }];

                    // 2. Create a new container for this render
                    const root = document.body;
                    const container = document.createElement("div");
                    container.classList.add("preview-hidden");
                    // We need to append it to the body so PagedJS can calculate layout
                    root.appendChild(container);

                    // 3. Run PagedJS
                    if (window.Paged && window.Paged.Previewer) {
                        const previewer = new window.Paged.Previewer();

                        // We pass the stylesheets explicitly.
                        // PagedJS will parse them with Polisher and insert transformed styles into <head>.
                        await previewer.preview('<div id="print-root">' + html + "</div>", stylesheets, container);

                        // 4. If this is still the latest render, show it
                        if (renderId === currentRenderId) {
                            // Remove all other children (previous renders)
                            Array.from(root.children).forEach((child) => {
                                if (child !== container && child.tagName === "DIV") {
                                    child.remove();
                                }
                            });

                            container.classList.remove("preview-hidden");
                            container.classList.add("preview-visible");
                            window.setPreviewZoom(getCurrentZoomScale());

                            // Make links open in a new tab and ensure they are absolute
                            // TODO: Test this further, make sure it covers all scenarios
                            const anchors = container.querySelectorAll("a[href]");
                            anchors.forEach((anchor) => {
                                let href = anchor.getAttribute("href").trim();
                                if (!href) return;

                                // Check if the link starts with a protocol or a slash (for internal/relative)
                                // We use a regex to see if it starts with "http://", "https://", "mailto:", etc.
                                const hasProtocol = /^[a-z0-9]+:/i.test(href);
                                const isRelative = href.startsWith("/") || href.startsWith("#");

                                if (!hasProtocol && !isRelative) {
                                    href = "https://" + href;
                                    anchor.setAttribute("href", href);
                                }
                                if (!isRelative) {
                                    anchor.setAttribute("target", "_blank");
                                    anchor.setAttribute("rel", "noopener noreferrer");
                                }
                            });

                            // Cleanup styles from the PREVIOUS successful render
                            if (lastInsertedStyles && lastInsertedStyles.length > 0) {
                                lastInsertedStyles.forEach((style) => {
                                    if (style.parentNode) style.remove();
                                });
                            }

                            // Save the styles from THIS render to be cleaned up next time
                            // previewer.polisher.inserted contains the <style> elements added to head
                            lastInsertedStyles = previewer.polisher.inserted;
                        } else {
                            // This render is stale, discard it
                            container.remove();

                            // Also remove the styles this stale render added!
                            if (previewer.polisher.inserted) {
                                previewer.polisher.inserted.forEach((style) => {
                                    if (style.parentNode) style.remove();
                                });
                            }
                        }
                    }
                } catch (err) {
                    console.error("PagedJS render error:", err);
                } finally {
                    isRendering = false;
                    // If there's a queued render, run it now
                    if (queuedRender) {
                        const { html, css } = queuedRender;
                        queuedRender = null;
                        window.renderPreview(html, css);
                    }
                }
            };
        </script>
    </head>
    <body></body>
</html>
